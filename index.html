<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>记账助手</title>
  <style>
    body { max-width: 600px; margin: 40px auto; font-family: sans-serif; }
    #log { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
    .user { text-align: right; color: #1a5fb4; margin: 6px 0; }
    .bot  { text-align: left;  color: #333;    margin: 6px 0; }
    .err  { color: #c01c28; margin: 6px 0; }
    #input { width: 75%; padding: 6px; }
  </style>
</head>
<body>
  <h2>记账助手</h2>
  <div id="log"></div>
  <input id="input" placeholder="比如：午饭花了20">
  <button id="send">发送</button>
  <button id="reset">新对话</button>

  <script>
   // ===== 1. 找到页面元素 =====
const log = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const resetBtn = document.getElementById("reset");

// ===== 2. 会话号存在浏览器的 localStorage 里，刷新页面也不会丢 =====
// localStorage.getItem 取出来，没有就是 null
let sessionId = localStorage.getItem("session_id");
let busy = false;   // 正在等服务器回复时为 true，防止用户连续发送


// ===== 3. 往聊天区加一行 =====
// cls："user" 右边蓝色，"bot" 左边，"err" 红色
function addMessage(text, cls) {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;          // textContent 只当文字显示，防止 XSS
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}


// ===== 4. 发 POST 请求，返回 {status, data} =====
// 发请求时自动带上存好的口令
function sendRequest(url, body) {
  return fetch(url, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Access-Key": localStorage.getItem("access_key") || "",
    },
    body: JSON.stringify(body),
  });
}

async function postJSON(url, body) {
  let resp = await sendRequest(url, body);

  // 没有口令或口令错误：弹窗输入，再用新口令把这次请求重发一次
  if (resp.status === 401) {
    const key = window.prompt("请输入访问口令");
    if (key) {
      localStorage.setItem("access_key", key.trim());
      resp = await sendRequest(url, body);
    }
  }

  // 还是 401，说明输入的口令也不对，清掉它，下次重新弹窗
  if (resp.status === 401) {
    localStorage.removeItem("access_key");
  }

  const data = await resp.json();
  return {status: resp.status, data: data};
}



// ===== 5. 把 /chat 或 /chat/confirm 的结果显示出来 =====
// 收到 confirm 就弹窗，用户选完再调 /chat/confirm。
// confirm 之后还可能是 confirm（删两笔），所以用 while，和 Python 的 main 一样。
async function handleResult(r) {
  while (true) {
    // 出错：显示 detail 后结束
    if (r.status !== 200) {
      if (r.status === 404) {
        // 会话在服务器上不存在了，清掉本地的号，下一句会开新会话
        sessionId = null;
        localStorage.removeItem("session_id");
      }
      addMessage("出错：" + r.data.detail, "err");
      return;
    }

    // 记住会话号
    sessionId = r.data.session_id;
    localStorage.setItem("session_id", sessionId);

    // 普通回复：显示后结束
    if (r.data.type === "reply") {
      addMessage(r.data.reply, "bot");
      return;
    }

    // 需要确认删除：弹窗问用户
    const rec = r.data.record;
    let text;
    if (rec) {
      text = "确认执行这一步吗？\n#" + rec.id + " " + rec.created_at + " " +
             rec.record_type + " " + rec.amount + "元 " + rec.category + " " + (rec.remark || "");
    } else if (r.data.tool === "delete_record") {
      text = "要删除的记录已经不存在了，仍然继续吗？";
    } else {
      text = "确认执行 " + r.data.tool + " 吗？\n参数：" + JSON.stringify(r.data.arguments);
    }

    const approved = window.confirm(text);   // 浏览器自带的确定/取消弹窗，点确定返回 true
    addMessage(approved ? "（已确认删除）" : "（已取消删除）", "user");

    r = await postJSON("/chat/confirm", {session_id: sessionId, approved: approved});
    // 回到 while 开头，按同样的规则处理新结果
  }
}


// ===== 6. 发送一句话 =====
async function sendMessage() {
  const text = input.value.trim();
  if (!text || busy) return;        // 空消息、或者上一句还没回来，都不发

  busy = true;
  sendBtn.disabled = true;
  addMessage(text, "user");
  input.value = "";

  const body = {message: text};
  if (sessionId !== null) {
    body.session_id = sessionId;
  }

  try {
    const r = await postJSON("/chat", body);
    await handleResult(r);
  } catch (e) {
    // 连不上服务器（比如 uvicorn 没开），fetch 会抛异常
    addMessage("连接失败：" + e.message, "err");
  } finally {
    // 不管成功失败都恢复按钮，和 Python 的 finally 一样
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}


// ===== 7. 开新对话：清掉会话号和聊天区 =====
function resetChat() {
  sessionId = null;
  localStorage.removeItem("session_id");
  log.innerHTML = "";               // 清空聊天区（这里没有放入用户内容，用 innerHTML 是安全的）
  addMessage("已开始新对话", "bot");
}


// ===== 8. 绑定按钮和回车 =====
sendBtn.addEventListener("click", sendMessage);
resetBtn.addEventListener("click", resetChat);
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

  </script>
</body>
</html>
